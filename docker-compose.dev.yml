version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER_DEV}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_DEV}
      - POSTGRES_DB=${POSTGRES_DB_DEV}
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER_DEV}
      - POSTGRES_USER=${POSTGRES_USER_DEV}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_DEV}
      - POSTGRES_DB=${POSTGRES_DB_DEV}
      - SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI_DEV}
      - ZAPI_CLIENT_TOKEN=${ZAPI_CLIENT_TOKEN_DEV}
      - ZAPI_INSTANCE_TOKEN=${ZAPI_INSTANCE_TOKEN_DEV}
      - ZAPI_INSTANCE_ID=${ZAPI_INSTANCE_ID_DEV}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL_DEV}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
